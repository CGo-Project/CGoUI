name: CGoUI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, package and smoke-test
        run: npm run release:check

      - name: Check localized website JavaScript
        run: |
          node --check i18n/catalog-core.js
          node --check i18n/catalog-foundation.js
          node --check i18n/catalog-demos.js
          node --check i18n/localized-page.js
          node --check i18n/runtime.js
