    <style>
        /* Web Components 元素未注册前的占位与防无样式闪烁 */
        cgo-icon:not(:defined), cgo-side-nav:not(:defined), cgo-theme-toggle:not(:defined) {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            visibility: visible;
            opacity: 0.6;
        }

        /* ===== 文档站布局 ===== */
        body {
            margin: 0;
            min-height: 100vh;
        }

        .doc-shell {
            display: flex;
            height: calc(100dvh - 60px);
            overflow: hidden;
            transition: height 0.25s ease;
        }

        /* 悬浮菜单栏模式下的文档站布局自适应（桌面端左右并排浮动架构） */
        :root[header-mode="floating"] .doc-shell,
        body[header-mode="floating"] .doc-shell {
            height: 100dvh;
        }

        @media (min-width: 641px) {
            :root[header-mode="floating"] .doc-shell,
            body[header-mode="floating"] .doc-shell {
                height: 100dvh;
                padding: 0;
                display: flex;
            }

            :root[header-mode="floating"] cgo-side-nav,
            body[header-mode="floating"] cgo-side-nav {
                height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 104px);
                width: var(--cgo-nav-width, 280px);
                flex-shrink: 0;
                margin-top: calc(env(safe-area-inset-top, 0px) + 84px);
                margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
                margin-left: calc(20px + env(safe-area-inset-left, 0px));
                margin-right: 0;
                padding-top: 0;
                z-index: 1000;
            }

            :root[header-mode="floating"] .doc-main,
            body[header-mode="floating"] .doc-main {
                flex: 1;
                min-width: 0;
                height: 100dvh;
                overflow-y: auto;
                overscroll-behavior: contain;
                box-sizing: border-box;
                padding-top: calc(env(safe-area-inset-top, 0px) + 88px);
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
                padding-left: 24px;
                padding-right: clamp(20px, 5vw, 64px);
            }
        }

        @media (max-width: 640px) {
            :root[header-mode="floating"] .doc-shell,
            body[header-mode="floating"] .doc-shell {
                height: 100dvh;
                display: flex;
                flex-direction: column;
                padding: 0;
            }
            :root[header-mode="floating"] cgo-side-nav,
            body[header-mode="floating"] cgo-side-nav {
                margin-top: calc(env(safe-area-inset-top, 0px) + 72px);
                margin-left: calc(10px + env(safe-area-inset-left, 0px));
                margin-right: calc(10px + env(safe-area-inset-right, 0px));
                width: calc(100% - 20px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
                max-width: calc(100% - 20px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
                flex-shrink: 0;
                box-sizing: border-box;
                z-index: 1000;
            }
            :root[header-mode="floating"] .doc-main,
            body[header-mode="floating"] .doc-main {
                padding-top: 20px;
            }
        }

        /* 文档站侧边导航组件定制 */
        cgo-side-nav {
            flex-shrink: 0;
            height: 100%;
            --sidenav-width: var(--cgo-nav-width, 280px);
            --sidenav-item-px: 16px;
            --sidenav-item-gap: 2px;
        }

        .doc-main {
            flex: 1;
            min-width: 0;
            padding: 36px clamp(20px, 5vw, 64px) 80px;
            max-width: 960px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .doc-h1 {
            font-size: 30px;
            font-weight: 800;
            margin: 0 0 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .doc-h1 cgo-icon {
            --cgo-icon-size: 28px;
        }

        .doc-tag {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            background: var(--info-bg);
            padding: 3px 10px;
            border-radius: var(--radius-sm);
        }

        .doc-lead {
            color: var(--text-light);
            font-size: 15px;
            margin: 0 0 28px;
            line-height: 1.7;
        }

        .doc-h2 {
            font-size: 18px;
            font-weight: 700;
            margin: 36px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        /* 实例演示卡 */
        .example {
            margin-bottom: 24px;
        }

        .example-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .preview {
            position: relative;
            min-height: 80px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            padding: 20px 24px;
            background: var(--card-bg);
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }

        .code-wrap {
            position: relative;
        }

        .code-wrap pre {
            margin: 0;
            padding: 16px 18px;
            background: #00263b;
            color: #fff;
            border-radius: var(--radius-md);
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .preview+.code-wrap pre {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        [data-theme="dark"] .code-wrap pre {
            color: #cecece;
            background: #131313;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            height: 26px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.1);
            color: #cfd8e3;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-xs);
            padding: 0 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            line-height: 1;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* API 表格 */
        .api-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
            font-size: 13px;
            min-width: 0;
        }

        .api-table th,
        .api-table td {
            text-align: left;
            padding: 9px 12px;
            border-bottom: 1px solid var(--table-cell-border);
            white-space: normal;
        }

        .api-table th {
            background: var(--table-head-bg);
            color: var(--table-head-text);
            font-weight: 600;
        }

        .api-table td:first-child {
            font-family: var(--font-mono);
            color: var(--primary-color);
            font-weight: 600;
        }

        .api-table .t-type {
            font-family: var(--font-mono);
            color: var(--text-light);
            font-size: 12px;
        }

        .api-table .t-default {
            font-family: var(--font-mono);
            color: var(--success-color);
            font-size: 12px;
        }

        .api-empty {
            color: var(--text-light);
            font-size: 13px;
            font-style: italic;
            margin: 4px 0 8px;
        }

        /* 基础页：色板 / token / 图标 */
        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .swatch-grid.compact {
            grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        }

        .swatch {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--card-bg);
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            font: inherit;
            padding: 0;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
        }

        .swatch:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .swatch-color {
            height: 60px;
            flex-shrink: 0;
        }

        .swatch-meta {
            padding: 8px 10px;
            font-size: 12px;
            flex: 1;
        }

        .swatch-meta b {
            display: block;
            font-family: var(--font-mono);
        }

        .swatch-meta span {
            color: var(--text-light);
        }

        .swatch-meta em {
            display: block;
            color: var(--text-light);
            font-style: normal;
            margin-top: 3px;
            opacity: 0.85;
        }

        .color-group-title {
            margin-top: 28px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 10px;
        }

        .icon-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 6px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
            text-align: center;
        }

        .icon-cell:hover {
            border-color: var(--primary-color);
            background: var(--info-bg);
            transform: translateY(-2px);
        }

        .icon-cell span {
            font-size: 11px;
            color: var(--text-light);
            font-family: var(--font-mono);
            word-break: break-all;
        }

        .token-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .token-name {
            font-family: var(--font-mono);
            font-size: 13px;
            width: 170px;
            color: var(--primary-color);
        }

        .token-tile-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-start;
        }

        .token-tile {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 0;
            background: transparent;
            color: var(--text-light);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }

        .token-square {
            width: 76px;
            height: 76px;
            display: block;
            background: var(--primary-color);
        }

        .token-square.shadow {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
        }

        .avatar-color-board {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            width: 100%;
            align-items: center;
            padding: 8px;
        }

        .avatar-color-copy {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 0;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }

        .avatar-color-copy:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .avatar-color-copy:nth-child(7) {
            color: #00263b;
        }

        @media (max-width: 640px) {
            .doc-shell {
                flex-direction: column;
            }

            cgo-side-nav {
                position: sticky;
                top: 0;
                z-index: 100;
                height: auto;
            }

            .doc-main {
                padding: 16px 18px 60px;
            }
        }

        /* ===== 文档站演示区辅助样式（原 legacy-helpers.css） ===== */
        .preview-box {
            position: relative;
            border: none;
            background: transparent;
            border-radius: var(--radius-lg, 12px);
            padding: 24px;
            margin-bottom: 8px;
            overflow: hidden;
            isolation: isolate;
            box-shadow: var(--glass-shadow);
        }

        .preview-box .liquid-glass-effect {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
            -webkit-backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
            filter: var(--glass-refraction-filter, url(#glass-distortion));
            pointer-events: none;
            overflow: hidden;
            isolation: isolate;
        }

        .preview-box:not(:has(.liquid-glass-effect)) {
            backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
            -webkit-backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
        }

        .preview-box::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: inherit;
            background: var(--glass-bg, rgba(255, 255, 255, 0.60));
            pointer-events: none;
        }

        [data-theme='dark'] .preview-box::after,
        :root:not([data-theme='light']) .preview-box::after {
            background: var(--glass-bg, rgba(31, 32, 34, 0.60));
        }

        .preview-box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background:
                linear-gradient(to right,
                    rgba(0, 38, 59, var(--lg-rim-dark, 0.04)) 0,
                    rgba(0, 0, 0, 0) var(--lg-rim-side, 4px),
                    rgba(0, 0, 0, 0) calc(100% - var(--lg-rim-side, 4px)),
                    rgba(0, 38, 59, var(--lg-rim-dark, 0.04)) 100%),
                linear-gradient(to bottom,
                    rgba(255, 255, 255, var(--lg-rim-lit, 0.95)) 0,
                    rgba(255, 255, 255, var(--lg-rim-lit, 0.95)) var(--lg-rim-hold, 1px),
                    rgba(255, 255, 255, 0) var(--lg-rim-fade, 12px),
                    rgba(255, 255, 255, 0) calc(100% - var(--lg-rim-fade, 12px)),
                    rgba(255, 255, 255, calc(var(--lg-rim-lit, 0.95) * 0.4)) calc(100% - var(--lg-rim-hold, 1px)),
                    rgba(255, 255, 255, calc(var(--lg-rim-lit, 0.95) * 0.4)) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
        }

        .preview-box > * {
            position: relative;
            z-index: 3;
        }

        .metro-palette-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dotted var(--border-color);
        }

        .palette-toggles {
            display: flex;
            gap: 6px;
        }

        .color-compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .compare-card {
            position: relative;
            border: none;
            background: transparent;
            border-radius: var(--radius-lg, 12px);
            overflow: hidden;
            isolation: isolate;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            transition: box-shadow var(--glass-duration, 0.28s) var(--glass-easing, cubic-bezier(0.32, 0.72, 0, 1));
        }

        .compare-card:hover {
            box-shadow: var(--glass-shadow-hover);
        }

        .compare-card .liquid-glass-effect {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
            -webkit-backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
            filter: var(--glass-refraction-filter, url(#glass-distortion));
            pointer-events: none;
            overflow: hidden;
            isolation: isolate;
        }

        .compare-card:not(:has(.liquid-glass-effect)) {
            backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
            -webkit-backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(130%));
        }

        .compare-card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: inherit;
            background: var(--glass-bg, rgba(255, 255, 255, 0.60));
            pointer-events: none;
            transition: background-color 0.25s ease;
        }

        .compare-card:hover::after {
            background: var(--glass-bg-hover, rgba(255, 255, 255, 0.68));
        }

        [data-theme='dark'] .compare-card::after,
        :root:not([data-theme='light']) .compare-card::after {
            background: var(--glass-bg, rgba(31, 32, 34, 0.60));
        }

        [data-theme='dark'] .compare-card:hover::after,
        :root:not([data-theme='light']) .compare-card:hover::after {
            background: var(--glass-bg-hover, rgba(38, 40, 44, 0.68));
        }

        .compare-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background:
                linear-gradient(to right,
                    rgba(0, 38, 59, var(--lg-rim-dark, 0.04)) 0,
                    rgba(0, 0, 0, 0) var(--lg-rim-side, 4px),
                    rgba(0, 0, 0, 0) calc(100% - var(--lg-rim-side, 4px)),
                    rgba(0, 38, 59, var(--lg-rim-dark, 0.04)) 100%),
                linear-gradient(to bottom,
                    rgba(255, 255, 255, var(--lg-rim-lit, 0.95)) 0,
                    rgba(255, 255, 255, var(--lg-rim-lit, 0.95)) var(--lg-rim-hold, 1px),
                    rgba(255, 255, 255, 0) var(--lg-rim-fade, 12px),
                    rgba(255, 255, 255, 0) calc(100% - var(--lg-rim-fade, 12px)),
                    rgba(255, 255, 255, calc(var(--lg-rim-lit, 0.95) * 0.4)) calc(100% - var(--lg-rim-hold, 1px)),
                    rgba(255, 255, 255, calc(var(--lg-rim-lit, 0.95) * 0.4)) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.25s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .compare-card > * {
            position: relative;
            z-index: 3;
        }

        .compare-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 13px;
        }

        .compare-split-bar {
            display: flex;
            height: 48px;
        }

        .compare-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .compare-half.light-text {
            color: #fff;
        }

        .compare-half.dark-text {
            color: #00263b;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        .compare-label-tag {
            position: absolute;
            top: 4px;
            font-size: 8px;
            font-weight: 800;
            opacity: 0.7;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .compare-body {
            padding: 12px 14px;
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .line-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .line-swatch {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--card-bg);
            text-align: left;
            cursor: pointer;
            font: inherit;
            padding: 0;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
        }

        .line-swatch:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        .line-swatch-color {
            height: 50px;
            flex-shrink: 0;
        }

        .line-swatch-meta {
            padding: 8px 10px;
            font-size: 12px;
        }

        .line-swatch-meta b {
            display: block;
            font-weight: 600;
        }

    <svg id="cgo-liquid-glass-filters" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox" color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence" />
                <feComponentTransfer in="turbulence" result="mapped">
                    <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
                    <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
                    <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
                </feComponentTransfer>
                <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
                <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lighting-color="white" result="specLight">
                    <fePointLight x="-200" y="-200" z="300" />
                </feSpecularLighting>
                <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
                <feDisplacementMap in="SourceGraphic" in2="softMap" scale="100" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>
