<!DOCTYPE html>
<html lang="zh-CN" glass-mode="liquid">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="CGoUI 工具类页面模板 Demo">
    <title>工具类页面模板 - CGoUI Demo</title>

    <!-- ===== 0. 防闪烁主题脚本（Anti-Flicker，必须最先注入）===== -->
    <script>
      (function() {
        var t = localStorage.getItem('app-theme');
        document.documentElement.setAttribute('data-theme', t || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      })();
    </script>

    <!--
      ===== 1. CGoUI 样式体系引入 =====
      本地路径（放于项目根目录 cgoui/ 文件夹中，脚本取自 dist/ 打包产物）：
        cgoui/styles/cgo_clr.css
        cgoui/styles/cgo_element.css
        cgoui/styles/cgo_ui.css
        cgoui/styles/cgo_components.css
        cgoui/cgo-ui.js
      CDN 路径：https://cdn.jsdelivr.net/npm/@centralgo/cgo-ui@latest/dist/styles/
    -->
    <link rel="stylesheet" href="../styles/cgo_clr.css">
    <link rel="stylesheet" href="../styles/cgo_element.css">
    <link rel="stylesheet" href="../styles/cgo_ui.css">
    <link rel="stylesheet" href="../styles/cgo_components.css">

    <!-- ===== 2. CGoUI 模块脚本（ES Module 引入）===== -->
    <!-- CDN 方式: <script type="module" src="https://cdn.jsdelivr.net/npm/@centralgo/cgo-ui@latest/dist/cgo-ui.js"></script> -->
    <script type="module" src="../dist/cgo-ui.js"></script>

    <style>
        /* Web Components 未注册前防闪烁（FOUC 防护） */
        cgo-icon:not(:defined),
        cgo-button:not(:defined),
        cgo-theme-toggle:not(:defined),
        cgo-tabs:not(:defined) {
            display: inline-flex;
            visibility: visible;
            opacity: 0.6;
        }

        /* 页面基础容器配置（工具页：固定全屏，内部滚动，液态玻璃背景）*/
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            background: radial-gradient(circle at 15% 15%, rgba(0, 96, 152, 0.08), transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(0, 160, 233, 0.06), transparent 45%),
                        var(--bg-color, #f8f9fa);
            color: var(--text-main, #00263b);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        [data-theme="dark"] body {
            background: radial-gradient(circle at 15% 15%, rgba(0, 96, 152, 0.16), transparent 50%),
                        radial-gradient(circle at 85% 85%, rgba(15, 35, 60, 0.35), transparent 50%),
                        var(--bg-color, #0f1115);
        }

        .tool-container {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* 工具栏卡片 (Liquid Glass) */
        .tool-card {
            background: var(--glass-bg, #ffffff);
            backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(180%));
            -webkit-backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(180%));
            border: 1px solid var(--glass-border, #dee2e6);
            border-radius: 10px;
            box-shadow: var(--lg-shadow, 0 4px 16px rgba(0,0,0,0.04));
        }

        /* Excel 样式高级表格配置示例 (Liquid Glass) */
        .table-container {
            flex: 1;
            min-height: 0;
            overflow: auto;
            border-radius: 8px;
            border: 1px solid var(--glass-border, var(--table-cell-border, #dee2e6));
            background: var(--glass-bg, #ffffff);
            backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(180%));
            -webkit-backdrop-filter: var(--glass-backdrop-blur, blur(5px) saturate(180%));
            box-shadow: var(--lg-shadow, 0 8px 24px rgba(0, 0, 0, 0.04));
        }

        #toolDataTable {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        #toolDataTable th,
        #toolDataTable td {
            padding: 10px 14px;
            border-right: 1px solid var(--table-cell-border, #dee2e6);
            border-bottom: 1px solid var(--table-cell-border, #dee2e6);
            font-size: 13px;
            text-align: left;
        }

        #toolDataTable thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--table-head-bg, #f1f3f5);
            font-weight: 600;
        }

        #toolDataTable tbody tr:hover {
            background-color: var(--table-row-hover, #f8f9fa);
        }

        /* 首列粘性固定 (类似 Excel) */
        #toolDataTable tbody td:first-child {
            position: sticky;
            left: 0;
            z-index: 5;
            background-color: var(--card-bg, #ffffff);
            font-weight: 600;
        }

        #toolDataTable thead tr:first-child th:first-child {
            position: sticky;
            left: 0;
            z-index: 11;
        }

        /* 工具栏搜索框 */
        .tool-search-input {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color, #ccc);
            font-size: 13px;
            background: var(--card-bg, #ffffff);
            color: var(--text-main, #00263b);
            outline: none;
            transition: border-color 0.2s;
        }

        .tool-search-input:focus {
            border-color: var(--primary-color, #00263b);
        }
    </style>
</head>

<body>
    <!-- Liquid Glass 硬件加速空间折射滤镜管线 -->
    <svg id="cgo-liquid-glass-filters" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.025 0.025" numOctaves="1" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- ==================== 顶部菜单栏 Header (三段式布局) ==================== -->
    <header class="tool-header">
        <!-- 1. 左侧：导航按钮区 -->
        <div class="header-left">
            <button class="btn btn-info" onclick="history.back()" title="返回上一页">
                <cgo-icon name="back"></cgo-icon>
                <span>返回</span>
            </button>
            <a href="../index.html" class="btn btn-primary" title="前往仪表盘">
                <cgo-icon name="home-dots"></cgo-icon>
                <span>仪表盘</span>
            </a>
        </div>

        <!-- 2. 中间：图标 + 应用标题 -->
        <div class="header-center">
            <cgo-icon name="design" size="24" class="header-logo"></cgo-icon>
            <span class="app-title">示例工具工作台</span>
        </div>

        <!-- 3. 右侧：选项与功能按钮区 -->
        <div class="header-right">
            <!-- 导出下拉菜单 -->
            <div class="dropdown">
                <button class="btn btn-info dropbtn">
                    <cgo-icon name="download"></cgo-icon>
                    <span>导出</span>
                </button>
                <div class="dropdown-content">
                    <a href="javascript:void(0)" id="export-img">
                        <cgo-icon name="image"></cgo-icon>
                        <span>导出图片 (PNG/JPG)</span>
                    </a>
                    <a href="javascript:void(0)" id="export-json">
                        <cgo-icon name="code"></cgo-icon>
                        <span>导出数据 (JSON)</span>
                    </a>
                </div>
            </div>

            <!-- 主题切换组件 -->
            <cgo-theme-toggle></cgo-theme-toggle>

            <!-- 更多下拉菜单 -->
            <div class="dropdown options-dropdown">
                <button id="options-btn" class="btn btn-info dropbtn" title="更多">
                    <cgo-icon name="menu"></cgo-icon>
                    <span>更多</span>
                </button>
                <div class="dropdown-content">
                    <a href="javascript:void(0)" id="help-btn">
                        <cgo-icon name="help"></cgo-icon>
                        <span>帮助与设置</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- ==================== 下方工作区 Main ==================== -->
    <main class="tool-container">

        <!-- 工具栏 / 操作面板 -->
        <div class="tool-card" style="margin-bottom: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <span style="font-weight: 600; font-size: 14px;">工作区工具栏：</span>
            <cgo-button variant="glass" icon="sparkle" size="sm">液态玻璃</cgo-button>
            <cgo-button variant="primary" icon="add" size="sm">新增项目</cgo-button>
            <cgo-button variant="info" icon="refresh" size="sm">刷新数据</cgo-button>
            <cgo-button variant="danger" icon="delete" size="sm">批量清理</cgo-button>
            <div style="margin-left: auto; display: flex; gap: 8px; align-items: center;">
                <input type="text" placeholder="搜索关键词..." class="tool-search-input" aria-label="搜索关键词">
            </div>
        </div>

        <!-- 数据表格 / 操作主区域 -->
        <div class="table-container">
            <table id="toolDataTable">
                <thead>
                    <tr>
                        <th>编号 / 项目名</th>
                        <th>类别</th>
                        <th>数据参数 A</th>
                        <th>数据参数 B</th>
                        <th>数据状态</th>
                        <th>更新时间</th>
                        <th>快捷操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>示例项目 #01</td>
                        <td>矢量数据</td>
                        <td>1024 KB</td>
                        <td>4K RGB Color</td>
                        <td><span style="color: var(--success-color, #28a745);">正常</span></td>
                        <td>2026-08-07</td>
                        <td>
                            <cgo-button variant="ghost" size="sm" icon="edit">编辑</cgo-button>
                        </td>
                    </tr>
                    <tr>
                        <td>示例项目 #02</td>
                        <td>导向模版</td>
                        <td>512 KB</td>
                        <td>CMYK Print</td>
                        <td><span style="color: var(--warning-color, #ffc107);">审核中</span></td>
                        <td>2026-08-06</td>
                        <td>
                            <cgo-button variant="ghost" size="sm" icon="edit">编辑</cgo-button>
                        </td>
                    </tr>
                    <tr>
                        <td>示例项目 #03</td>
                        <td>配色方案</td>
                        <td>256 KB</td>
                        <td>Pantone Spot</td>
                        <td><span style="color: var(--success-color, #28a745);">正常</span></td>
                        <td>2026-08-05</td>
                        <td>
                            <cgo-button variant="ghost" size="sm" icon="edit">编辑</cgo-button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>

</html>
